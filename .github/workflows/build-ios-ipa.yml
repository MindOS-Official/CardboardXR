name: Build CardboardXR Desktop IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: Attach IPA to a GitHub Release
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check pre-exported Unity Xcode project
        id: check_xcode
        run: |
          if [ -d "Builds/iOS/Unity-iPhone.xcodeproj" ]; then
            echo "unity_xcode=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity_xcode=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools (xcodegen and ldid)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen ldid
          xcodebuild -version

      - name: Stage ParsecSDK.framework for Unity Xcode build
        if: steps.check_xcode.outputs.unity_xcode == 'true'
        run: |
          FW="Assets/Plugins/iOS/ParsecSDK.framework"
          if [ ! -f "$FW/ParsecSDK" ] || [ ! -f "$FW/Headers/parsec.h" ]; then
            mkdir -p "$FW/Headers" "$FW/Modules"
            BASE="https://raw.githubusercontent.com/MalfoyJW/parsec-sdk/bb336699ee7acd7a4eb0c460410a65c23d7f3879"
            curl -fsSL "$BASE/Headers/parsec.h" -o "$FW/Headers/parsec.h"
            curl -fsSL "$BASE/Info.plist" -o "$FW/Info.plist"
            curl -fsSL "$BASE/Modules/module.modulemap" -o "$FW/Modules/module.modulemap"
            curl -fsSL "$BASE/ParsecSDK" -o "$FW/ParsecSDK"
            chmod +x "$FW/ParsecSDK"
          fi

      - name: Archive pre-exported Unity iOS app
        if: steps.check_xcode.outputs.unity_xcode == 'true'
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -archivePath build/CardboardXR.xcarchive \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          APP_DIR=$(ls -d build/CardboardXR.xcarchive/Products/Applications/*.app | head -1)
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Stage ParsecSDK.framework for native CardboardXR target
        if: steps.check_xcode.outputs.unity_xcode == 'false'
        run: |
          FW="ios-native/Frameworks/ParsecSDK.framework"
          mkdir -p "$FW/Headers" "$FW/Modules"
          if [ -f "Assets/Plugins/iOS/ParsecSDK.framework/ParsecSDK" ]; then
            cp -R Assets/Plugins/iOS/ParsecSDK.framework/* "$FW/"
          else
            BASE="https://raw.githubusercontent.com/MalfoyJW/parsec-sdk/bb336699ee7acd7a4eb0c460410a65c23d7f3879"
            curl -fsSL "$BASE/Headers/parsec.h" -o "$FW/Headers/parsec.h"
            curl -fsSL "$BASE/Info.plist" -o "$FW/Info.plist"
            curl -fsSL "$BASE/Modules/module.modulemap" -o "$FW/Modules/module.modulemap"
            curl -fsSL "$BASE/ParsecSDK" -o "$FW/ParsecSDK"
          fi
          chmod +x "$FW/ParsecSDK"
          ls -lh "$FW/ParsecSDK" "$FW/Headers/parsec.h"

      - name: Generate Xcode project and build native CardboardXRDesktop app
        if: steps.check_xcode.outputs.unity_xcode == 'false'
        run: |
          cd ios-native
          xcodegen generate
          xcodebuild \
            -project CardboardXRDesktop.xcodeproj \
            -scheme CardboardXRDesktop \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          ls -la "$PWD/build/Release-iphoneos/CardboardXRDesktop.app"
          echo "APP_DIR=ios-native/build/Release-iphoneos/CardboardXRDesktop.app" >> "$GITHUB_ENV"

      - name: Ad-hoc sign with ldid and package CardboardXR-Desktop.ipa
        run: |
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "Built .app bundle not found at APP_DIR='$APP_DIR'"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/
          PAYLOAD_APP="build/Payload/$(basename "$APP_DIR")"
          for fw in "$PAYLOAD_APP"/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            fwname=$(basename "$fw" .framework)
            if [ -f "$fw/$fwname" ]; then
              chmod +x "$fw/$fwname"
              ldid -S "$fw/$fwname"
            fi
          done
          APP_BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PAYLOAD_APP/Info.plist")
          chmod +x "$PAYLOAD_APP/$APP_BIN"
          ldid -S "$PAYLOAD_APP/$APP_BIN"
          rm -rf build/Payload/*.dSYM
          (cd build && zip -r -9 CardboardXR-Desktop.ipa Payload)
          ls -lh build/CardboardXR-Desktop.ipa

      - name: Upload CardboardXR-Desktop IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-Desktop-IPA
          path: build/CardboardXR-Desktop.ipa
          retention-days: 14

      - name: Publish Release
        if: github.event_name != 'pull_request' && (inputs.create_release == true || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: CardboardXR Desktop v${{ github.run_number }}
          files: build/CardboardXR-Desktop.ipa
